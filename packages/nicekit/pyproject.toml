[project]
name = "nicekit"
version = "0.1.0"
description = "Multi-tenant Agent + Knowledge Base platform SDK for Python — tenancy with PostgreSQL RLS, LLM routing, agent runtime, and hybrid retrieval."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "patrickleehua", email = "cyhlbh2010@gmail.com" },
]
maintainers = [
    { name = "patrickleehua", email = "cyhlbh2010@gmail.com" },
]
keywords = [
    "multi-tenant",
    "agent",
    "rag",
    "knowledge-base",
    "llm",
    "fastapi",
    "postgresql",
    "rls",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # 协议不写 classifier:PEP 639 的 License-Expression 才是权威来源,
    # 两者并存时构建后端「MAY」报错,没必要留这个前向风险。
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.116.0",
    "celery>=5.6.0",
    "email-validator>=2.3.0",
    "croniter>=6.2.4",
    "cryptography>=44.0.0",
    "docling>=2.110.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "minio>=7.2.20",
    "networkx>=3.6.1",
    "onnxruntime>=1.27.0",
    "openai>=2.44.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.4.2",
    "pillow>=12.3.0",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "trafilatura>=2.1.0",
    "uvicorn>=0.50.0",
    "xlrd>=2.0.2",
]

[project.urls]
Homepage = "https://github.com/patrickleehua/nice-knowledge"
Repository = "https://github.com/patrickleehua/nice-knowledge"
Documentation = "https://github.com/patrickleehua/nice-knowledge/tree/main/docs"
Issues = "https://github.com/patrickleehua/nice-knowledge/issues"
Changelog = "https://github.com/patrickleehua/nice-knowledge/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[build-system]
# >=1.27 是 PEP 639(license = "Apache-2.0" + license-files)的最低支持版本
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nicekit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/nicekit",
    "tests",
    "alembic.ini",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate 产物不做行宽约束
"src/nicekit/migrations/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: 需要真实外部服务(LLM API / 数据库)的用例,默认跳过,用 -m live 显式运行",
]
addopts = "-m 'not live'"
