[project]
name = "nice-knowledge"
version = "0.1.0"
description = "多租户 Agent + KB 平台 SDK 单仓(uv workspace 根,不承载代码)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "patrickleehua", email = "cyhlbh2010@gmail.com" },
]
dependencies = [
    "nicekit",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.uv]
# workspace 根只做聚合,不构建/安装自身
package = false

[tool.uv.workspace]
members = ["packages/nicekit", "apps/demo/backend"]

[tool.uv.sources]
nicekit = { workspace = true }
nicekit-demo-backend = { workspace = true }
