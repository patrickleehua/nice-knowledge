[project]
name = "nicekit-demo-backend"
version = "0.1.0"
description = "Nice Knowledge:基于 NiceKit SDK 的最小宿主示例"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "patrickleehua", email = "cyhlbh2010@gmail.com" },
]
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "nicekit",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_backend"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
